name: Android Kotlin APK Build

on:
  push:
    branches: [ "main", "arena/**" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Test Data Sync Kotlin APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest

      - name: Assemble Debug & Optimized Release APKs
        run: ./gradlew assembleDebug assembleRelease

      - name: Prepare Named APK Deliverables
        run: |
          mkdir -p dist-apk
          cp app/build/outputs/apk/debug/app-debug.apk dist-apk/DataSync-v4.0.0-debug.apk
          cp app/build/outputs/apk/release/app-release.apk dist-apk/DataSync-v4.0.0-release.apk
          ls -lh dist-apk/

      - name: Upload Data Sync Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: DataSync-v4.0.0-debug-apk
          path: dist-apk/DataSync-v4.0.0-debug.apk

      - name: Upload Data Sync Optimized Release APK
        uses: actions/upload-artifact@v4
        with:
          name: DataSync-v4.0.0-release-apk
          path: dist-apk/DataSync-v4.0.0-release.apk

      - name: Publish Direct Download APKs to GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v4.0.0
          target_commitish: ${{ github.sha }}
          name: "Data Sync v4.0.0 — Native Kotlin & Jetpack Compose"
          body: |
            Native Kotlin & Jetpack Compose (Material 3) build of **Data Sync** (`com.nexussync.datausage`).
            - `DataSync-v4.0.0-release.apk` — R8-minified, resource-shrunk, ready-to-install APK (~1.5 MB)
            - `DataSync-v4.0.0-debug.apk` — Full debuggable APK
          prerelease: false
          files: |
            dist-apk/DataSync-v4.0.0-release.apk
            dist-apk/DataSync-v4.0.0-debug.apk
