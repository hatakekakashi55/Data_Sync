<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 96" width="100%" height="96" role="img" aria-label="Data Sync Footer">
  <defs>
    <linearGradient id="footerBg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#090D16" />
      <stop offset="50%" stop-color="#0F1C2E" />
      <stop offset="100%" stop-color="#090D16" />
    </linearGradient>
    <linearGradient id="scanLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#090D16" stop-opacity="0" />
      <stop offset="50%" stop-color="#2DD4BF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#090D16" stop-opacity="0" />
    </linearGradient>
    <style>
      .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Inter, Helvetica, Arial, sans-serif; }
      .font-mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }
      @keyframes sweep {
        0% { transform: translateX(-420px); }
        100% { transform: translateX(1220px); }
      }
      .beam { animation: sweep 5.5s ease-in-out infinite; }
    </style>
  </defs>

  <rect x="0" y="0" width="1200" height="96" rx="16" fill="url(#footerBg)" stroke="#1D2C44" stroke-width="1.2" />
  <rect x="0" y="0" width="380" height="2" fill="url(#scanLine)" class="beam" />

  <text x="600" y="44" text-anchor="middle" class="font-sans" font-size="14" font-weight="600" fill="#F1F5F9">DATA SYNC v4.0.0  •  ENGINEERED BY CODEDTH</text>
  <text x="600" y="66" text-anchor="middle" class="font-mono" font-size="11" letter-spacing="1.1" fill="#64748B">NATIVE KOTLIN  |  JETPACK COMPOSE MATERIAL 3  |  100% LOCAL ON-DEVICE PRIVACY</text>
</svg>
